# Cloudflare Worker that serves wildalert.app from the Cloud Run gateway -- see README.md here.
#
# Deploy:  npx wrangler deploy          (from this directory)
# Secrets: npx wrangler secret put ORIGIN_SECRET   (optional -- see README, "Closing the bypass")
#
# Nothing sensitive belongs in this file -- it is committed.
name = "wildalert-site"
main = "src/worker.js"
compatibility_date = "2026-10-29"

# No workers.dev URL for this script. It would be a second way into the gateway on a hostname we
# do not control, and the routes below are how it is meant to be reached. Same flag as the email
# worker, different reason.
#
# This must stay ABOVE [vars]: in TOML every key after a table header belongs to that table, so
# down there it would quietly become `vars.workers_dev` and the real setting would go missing.
workers_dev = false

# Both hostnames hit the same script: the apex serves the site, www 301s to the apex. The worker
# decides which, so there is no Cloudflare redirect rule to keep in sync with the code.
#
# `custom_domain = true`, not a path route, and that choice is what makes this deployable with
# nothing but `wrangler deploy`. A plain route needs a proxied DNS record to already exist, and
# neither wrangler nor the OAuth token it stores can create one (no DNS command; `zone:read`
# only), so a route would leave two dashboard clicks behind. A **Custom Domain** has Cloudflare
# create the DNS record and issue the certificate server-side, off the Workers API, which those
# scopes do cover. It also points *every* path at the worker, which is what we want -- the worker
# proxies the whole site.
#
# Zone WAF and rate-limiting rules still apply to these hostnames, so the abuse-control plan is
# unaffected. The usual caveat -- that Cloudflare may count a worker's subrequest against a rate
# limit when it stays on the same zone -- does not apply here: the subrequest goes to *.run.app,
# which is not this zone.
#
# Limits worth knowing: a Custom Domain cannot be created over an existing CNAME on that
# hostname (both were bare, only MX on the apex), and it does not support wildcards.
routes = [
  { pattern = "wildalert.app", custom_domain = true },
  { pattern = "www.wildalert.app", custom_domain = true },
]

# Not sensitive, and worth seeing in a diff when they change, so these are vars not secrets.
[vars]
# The Cloud Run gateway, hostname only. This is also the Host header the worker sends, which is
# the entire reason this worker exists -- see README.
ORIGIN_HOST = "gateway-lznkorfm4q-ey.a.run.app"
# The one hostname the site is served on. Any other hostname in `routes` redirects here.
CANONICAL_HOST = "wildalert.app"
