# Builds one service image from the repo root and pushes it to Artifact Registry.
# The build runs in the cloud, so no local Docker is needed (handy given Docker lives in WSL2).
#
# From a Cloud Build trigger (the normal path — see CONSOLE.md step 8), set two substitutions:
#   _SERVICE    = user-account
#   _IMAGE_BASE = europe-west3-docker.pkg.dev/wildalert-prod/wildalert/user-account
#
# The tag comes from $SHORT_SHA, the commit being built, so every image is traceable to its code
# with nothing to maintain. Note that $SHORT_SHA is only expanded *here*, in the build config —
# Cloud Build does not re-scan the value of a user substitution for built-ins, so putting
# "...:$SHORT_SHA" in a substitution field fails with "could not parse reference".
#
# Manually, pass the tag yourself:
#   gcloud builds submit --config deploy/cloudbuild.yaml --substitutions=\
#   _SERVICE=user-account,_IMAGE_BASE=<repo path>,SHORT_SHA=$(git rev-parse --short HEAD) .
#
# Each service's Dockerfile expects the repo root as its build context (it runs ./gradlew), which
# is why the Dockerfile is passed with --file rather than being found automatically.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=services/${_SERVICE}/Dockerfile
      - --tag=${_IMAGE_BASE}:$SHORT_SHA
      - .

images:
  - ${_IMAGE_BASE}:$SHORT_SHA

options:
  # The Gradle build is CPU-bound and the root .dockerignore excludes .gradle/, so every build
  # downloads Gradle and the dependencies fresh. A bigger machine keeps that to a few minutes.
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s
