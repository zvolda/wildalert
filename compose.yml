# Local development infrastructure — run with:  docker compose up -d
# (inside your WSL2 Ubuntu, where the free Docker Engine runs).
#
# Provides Postgres (used from Phase 1) and the Cloud Pub/Sub emulator with the topics and
# subscriptions the services expect. Nothing here is used in production — prod uses managed cloud
# services (the same Pub/Sub, for real).
#
# Two ways to run the pipeline:
#
#   docker compose up -d                        # infra only (Postgres + Pub/Sub emulator)
#   docker compose --profile local up -d --build # infra + all five services, in containers
#
# The second form is the easy one, and the reason is the emulator: it delivers events by POSTing to
# the services, so it has to be able to reach them. Inside the compose network it reaches them by
# container name and nothing else is needed. If you would rather run the services on your machine
# (./gradlew bootRun, uvicorn), they must listen where the emulator can find them: run them in the
# same WSL2 session as compose, bind uvicorn to 0.0.0.0, and point the two endpoints below at
# host.docker.internal (which `extra_hosts` on the emulator makes resolvable).

services:
  postgres:
    image: postgres:17
    container_name: wildalert-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pubsub:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    container_name: wildalert-pubsub
    # --host-port=0.0.0.0 matters: the emulator binds IPv6 localhost by default and would be
    # unreachable from outside the container.
    command: >
      gcloud beta emulators pubsub start
      --project=wildalert-local
      --host-port=0.0.0.0:8085
    ports:
      - "8085:8085"
    extra_hosts:
      # Docker Engine (unlike Docker Desktop) does not define host.docker.internal, and without it
      # the emulator cannot push events to the services running on the host.
      - "host.docker.internal:host-gateway"

  # One-shot provisioning. `gcloud pubsub` does NOT talk to the emulator, so this uses the
  # emulator's REST API directly. PUT is idempotent, so `docker compose up` can be re-run.
  # Note the emulator has no UpdateSubscription: to change a push URL, delete the subscription
  # first (DELETE /v1/projects/wildalert-local/subscriptions/<name>).
  pubsub-init:
    image: curlimages/curl:latest
    container_name: wildalert-pubsub-init
    depends_on:
      - pubsub
    environment:
      P: wildalert-local
      E: http://pubsub:8085
      # Container names, for the --profile local services below. Running the services on the host
      # instead? Override these with http://host.docker.internal:8084/... and :8082/...
      RECOGNITION: ${PUSH_RECOGNITION_URL:-http://recognition:8084/events/image-received}
      NOTIFICATION: ${PUSH_NOTIFICATION_URL:-http://notification:8082/api/events/animal-recognized}
      HISTORY: ${PUSH_HISTORY_URL:-http://detection-history:8086/api/events/animal-recognized}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "waiting for the emulator..."
        until curl -sf "$$E/v1/projects/$$P/topics" >/dev/null; do sleep 1; done

        for t in image.received image.received.dlt animal.recognized animal.recognized.dlt; do
          curl -sf -X PUT "$$E/v1/projects/$$P/topics/$$t" \
            -H 'Content-Type: application/json' -d '{}' >/dev/null
          echo "topic $$t"
        done

        # Push subscriptions. No oidcToken: the emulator has no IAM and plain http endpoints are
        # allowed. maxDeliveryAttempts/minimumBackoff mirror the real subscriptions so local
        # behaviour matches prod; the emulator does forward to dead-letter topics.
        curl -sf -X PUT "$$E/v1/projects/$$P/subscriptions/image.received.recognition" \
          -H 'Content-Type: application/json' -d '{
            "topic": "projects/'"$$P"'/topics/image.received",
            "pushConfig": { "pushEndpoint": "'"$$RECOGNITION"'" },
            "ackDeadlineSeconds": 600,
            "retryPolicy": { "minimumBackoff": "10s", "maximumBackoff": "600s" },
            "deadLetterPolicy": {
              "deadLetterTopic": "projects/'"$$P"'/topics/image.received.dlt",
              "maxDeliveryAttempts": 5
            }}' >/dev/null
        echo "subscription image.received.recognition -> $$RECOGNITION"

        curl -sf -X PUT "$$E/v1/projects/$$P/subscriptions/animal.recognized.notification" \
          -H 'Content-Type: application/json' -d '{
            "topic": "projects/'"$$P"'/topics/animal.recognized",
            "pushConfig": { "pushEndpoint": "'"$$NOTIFICATION"'" },
            "ackDeadlineSeconds": 60,
            "retryPolicy": { "minimumBackoff": "10s", "maximumBackoff": "600s" },
            "deadLetterPolicy": {
              "deadLetterTopic": "projects/'"$$P"'/topics/animal.recognized.dlt",
              "maxDeliveryAttempts": 5
            }}' >/dev/null
        echo "subscription animal.recognized.notification -> $$NOTIFICATION"

        # A SECOND subscription on the same topic — this is fan-out, and the reason the pipeline
        # is a broker rather than a chain of HTTP calls. detection-history gets its own copy of
        # every recognised animal and acknowledges it independently, so it can be down, slow or
        # redeploying without delaying an SMS, and neither consumer knows the other exists.
        curl -sf -X PUT "$$E/v1/projects/$$P/subscriptions/animal.recognized.history" \
          -H 'Content-Type: application/json' -d '{
            "topic": "projects/'"$$P"'/topics/animal.recognized",
            "pushConfig": { "pushEndpoint": "'"$$HISTORY"'" },
            "ackDeadlineSeconds": 60,
            "retryPolicy": { "minimumBackoff": "10s", "maximumBackoff": "600s" },
            "deadLetterPolicy": {
              "deadLetterTopic": "projects/'"$$P"'/topics/animal.recognized.dlt",
              "maxDeliveryAttempts": 5
            }}' >/dev/null
        echo "subscription animal.recognized.history -> $$HISTORY"

        # Pull subscriptions on the dead-letter topics. Without these the DLTs would DISCARD
        # everything sent to them — a topic with no subscription drops messages — and the whole
        # "nothing is lost" property would be a fiction. Pull them to inspect failures:
        #   curl -X POST $$E/v1/projects/$$P/subscriptions/image.received.dlt.inspect:pull \
        #     -H 'Content-Type: application/json' -d '{"maxMessages":10}'
        for t in image.received animal.recognized; do
          curl -sf -X PUT "$$E/v1/projects/$$P/subscriptions/$$t.dlt.inspect" \
            -H 'Content-Type: application/json' -d '{
              "topic": "projects/'"$$P"'/topics/'"$$t"'.dlt"
            }' >/dev/null
          echo "subscription $$t.dlt.inspect"
        done

        echo "pub/sub emulator ready: 4 topics, 5 subscriptions"

  # ---------------------------------------------------------------------------------------------
  # The services themselves, under the `local` profile so plain `docker compose up` stays infra-only.
  #
  #   ./gradlew build                                # the Kotlin images mount the jars you just built
  #   docker compose --profile local up -d --build
  #
  # The Kotlin services run a plain JRE image over the host-built bootJar: no image build, and your
  # Gradle cache does the compiling. (The glob skips the `-plain` jar, which has no dependencies.)
  # ---------------------------------------------------------------------------------------------

  user-account:
    image: eclipse-temurin:25-jre
    container_name: wildalert-user-account
    profiles: ["local"]
    command: sh -c 'java -jar $$(ls /app/*.jar | grep -v plain | head -1)'
    volumes:
      - ./services/user-account/build/libs:/app:ro
    environment:
      PORT: 8081
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      INBOUND_EMAIL_DOMAIN: ${INBOUND_EMAIL_DOMAIN:-wildalert.local}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  notification:
    image: eclipse-temurin:25-jre
    container_name: wildalert-notification
    profiles: ["local"]
    command: sh -c 'java -jar $$(ls /app/*.jar | grep -v plain | head -1)'
    volumes:
      - ./services/notification/build/libs:/app:ro
    environment:
      PORT: 8082
      # Turns on the push endpoint (application-pubsub.yml). No Pub/Sub client needed here.
      SPRING_PROFILES_ACTIVE: pubsub
      USER_ACCOUNT_BASE_URL: http://user-account:8081
      # Durable idempotency, so redelivery can't send a second SMS even across restarts.
      IDEMPOTENCY_STORE: postgres
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SMS_PROVIDER: logging
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy

  detection-history:
    image: eclipse-temurin:25-jre
    container_name: wildalert-detection-history
    profiles: ["local"]
    command: sh -c 'java -jar $$(ls /app/*.jar | grep -v plain | head -1)'
    volumes:
      - ./services/detection-history/build/libs:/app:ro
    environment:
      # 8085 is the Pub/Sub emulator, hence 8086.
      PORT: 8086
      # Turns on the push endpoint (application-pubsub.yml). No Pub/Sub client needed here.
      SPRING_PROFILES_ACTIVE: pubsub
      # The real store. Unlike notification's idempotency table, this is not an optimisation:
      # the in-memory default would forget every detection on restart.
      HISTORY_STORE: postgres
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy

  email-ingestion:
    image: eclipse-temurin:25-jre
    container_name: wildalert-email-ingestion
    profiles: ["local"]
    command: sh -c 'java -jar $$(ls /app/*.jar | grep -v plain | head -1)'
    volumes:
      - ./services/email-ingestion/build/libs:/app:ro
      - ./data/images:/data/images
    environment:
      PORT: 8083
      # Publishes for real (application-pubsub.yml + the GCP auto-configuration it needs).
      SPRING_PROFILES_ACTIVE: pubsub
      SPRING_CLOUD_GCP_PROJECT_ID: wildalert-local
      SPRING_CLOUD_GCP_PUBSUB_EMULATOR_HOST: pubsub:8085
      # Must be the same value user-account mints addresses on (above), or no recipient is
      # matched and the local pipeline goes quiet without erroring.
      INBOUND_EMAIL_DOMAIN: ${INBOUND_EMAIL_DOMAIN:-wildalert.local}
      STORAGE_PROVIDER: filesystem
      STORAGE_FILESYSTEM_ROOT: /data/images
    ports:
      - "8083:8083"
    depends_on:
      - pubsub

  recognition:
    build:
      context: ./services/recognition
      # The slim local image: stub classifier, no torch, no model weights. ./Dockerfile is the real
      # one (several GB) if you want to exercise DeepFaune.
      dockerfile: Dockerfile.local
    container_name: wildalert-recognition
    profiles: ["local"]
    volumes:
      - ./data/images:/data/images:ro
    environment:
      PORT: 8084
      RECOGNITION_EVENTS_PROVIDER: pubsub
      PUBSUB_EMULATOR_HOST: pubsub:8085
      PUBSUB_PROJECT_ID: wildalert-local
      RECOGNITION_IMAGE_SOURCE: local
      RECOGNITION_IMAGE_ROOT: /data/images
      RECOGNITION_CLASSIFIER: stub
    ports:
      - "8084:8084"
    depends_on:
      - pubsub

volumes:
  pgdata:
