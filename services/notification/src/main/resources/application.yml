spring:
  application:
    name: notification

  # Optional local secrets (Twilio creds) from the git-ignored .env at the repo root.
  config:
    import: optional:file:.env[.properties]

  # Outbound HTTP (the RestClient used to look up a hunter's phone number). More generous than
  # email-ingestion's on purpose: a timeout here throws, and Kafka retries the event, so waiting
  # out a cold-starting user-account is cheaper than burning a retry.
  http:
    client:
      connect-timeout: 2s
      read-timeout: 10s

  # Kafka — used only when events.provider=kafka. Host apps reach the compose broker on 29092.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      # All notification replicas share this group, so each event is handled by one of them.
      group-id: ${NOTIFICATION_CONSUMER_GROUP:notification}
      # A brand-new group starts from the oldest unprocessed events, not only new ones.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    # Producer is only used to park failed messages in <topic>.dlt (KafkaErrorHandlingConfig).
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  # Only used when idempotency.store=postgres (see PostgresIdempotencyConfig).
  datasource:
    url: ${DATABASE_URL:}
    username: ${POSTGRES_USER:}
    password: ${POSTGRES_PASSWORD:}

  # This service owns its own schema; user-account keeps the public one (separate Flyway history).
  flyway:
    schemas: notification
    create-schemas: true

server:
  # Cloud Run injects PORT; locally it falls back to the service's own port.
  port: ${PORT:8082}

services:
  # Base URL of the user-account service, used to look up the hunter's phone number.
  user-account:
    base-url: ${USER_ACCOUNT_BASE_URL:http://localhost:8081}

events:
  # 'none' (default — no consumer, the app runs without a broker) or 'kafka'
  provider: ${EVENTS_PROVIDER:none}
  topic:
    animal-recognized: ${ANIMAL_RECOGNIZED_TOPIC:animal.recognized}

idempotency:
  # Where handled events are remembered so a redelivery can't send a second SMS:
  # 'memory' (fake, default — per-instance, lost on restart) or 'postgres' (shared, durable).
  store: ${IDEMPOTENCY_STORE:memory}

sms:
  # 'logging' (fake, default) or 'twilio'
  provider: ${SMS_PROVIDER:logging}
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    sender-id: ${TWILIO_SENDER_ID:}

management:
  endpoints:
    web:
      exposure:
        # Health only. The other endpoints (env, metrics, heapdump) would leak configuration
        # from a public Cloud Run URL, and nothing needs them yet.
        include: health
  endpoint:
    health:
      # Adds /actuator/health/liveness and /actuator/health/readiness — the probes Cloud Run
      # calls. Both only report application state; this service has no data store whose outage
      # should take an instance out of rotation.
      probes:
        enabled: true
