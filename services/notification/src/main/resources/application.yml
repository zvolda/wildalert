spring:
  application:
    name: notification

  # Optional local secrets (Twilio creds) from the git-ignored .env at the repo root.
  config:
    import: optional:file:.env[.properties]

  # Outbound HTTP (the RestClient used to look up a hunter's phone number). Generous on purpose:
  # a timeout here throws, so the push returns 5xx and Pub/Sub redelivers — waiting out a
  # cold-starting user-account is cheaper than burning a delivery attempt.
  #
  # 25s, not 10s, because at 10s the first alert after any idle period *always* failed: a cold
  # Spring Boot + Flyway + Cloud SQL start takes longer than 10s, so attempt=1 died on a read
  # timeout and the SMS arrived ~24s late on attempt=2 (measured twice, 2026-10-26). 25s stays
  # well inside the 60s ack deadline, and the redelivery remains the net if it is still not enough.
  http:
    client:
      connect-timeout: 2s
      read-timeout: 25s

  # Only used when idempotency.store=postgres (see PostgresIdempotencyConfig).
  datasource:
    url: ${DATABASE_URL:}
    username: ${POSTGRES_USER:}
    password: ${POSTGRES_PASSWORD:}

  # This service owns its own schema; user-account keeps the public one (separate Flyway history).
  flyway:
    schemas: notification
    create-schemas: true

server:
  # Cloud Run injects PORT; locally it falls back to the service's own port.
  port: ${PORT:8082}

services:
  # Base URL of the user-account service, used to look up the hunter's phone number.
  user-account:
    base-url: ${USER_ACCOUNT_BASE_URL:http://localhost:8081}
    # 'none' (default) or 'gcp-id-token'. In the cloud user-account runs with Cloud Run's
    # "Require authentication", so calls need a Google ID token whose audience is base-url;
    # set USER_ACCOUNT_AUTH=gcp-id-token there. Locally there is nothing to authenticate to.
    auth: ${USER_ACCOUNT_AUTH:none}

billing:
  # What one alert costs the hunter, in CZK minor units (haléře). We pay GoSMS 1.20 per message,
  # so 1.50 covers it with a small margin. It travels to user-account on every charge, because
  # this service is the one that knows what an SMS costs -- user-account charges what it is told.
  #
  # Unlike the signup grant, a default is safe here and 150 is the documented price: forgetting
  # the variable charges the normal amount rather than giving alerts away. A 0 would be rejected
  # by the endpoint's @Min(1) anyway, so a missing price fails loudly instead of running free.
  # Pinned by SmsCostDefaultTest, so a change is a deliberate act and not a stray edit.
  sms-cost-minor: ${SMS_COST_MINOR:150}

events:
  # 'none' (default — no push endpoint, the app runs without a broker) or 'pubsub'.
  # Which topic feeds us is the subscription's business, not ours, so there is no topic setting:
  # Pub/Sub POSTs to /api/events/animal-recognized and the HTTP status is the acknowledgement.
  provider: ${EVENTS_PROVIDER:none}

idempotency:
  # Where handled events are remembered so a redelivery can't send a second SMS:
  # 'memory' (fake, default — per-instance, lost on restart) or 'postgres' (shared, durable).
  store: ${IDEMPOTENCY_STORE:memory}

sms:
  # 'logging' (fake, default), 'gosms' or 'twilio'
  provider: ${SMS_PROVIDER:logging}
  # GoSMS (gosms.eu) -- Czech gateway, no monthly fee. OAuth2 client credentials from the
  # admin panel; 'channel' is the numeric sending channel, which decides the sender shown on
  # the phone and the per-message price.
  gosms:
    client-id: ${GOSMS_CLIENT_ID:}
    client-secret: ${GOSMS_CLIENT_SECRET:}
    channel: ${GOSMS_CHANNEL:0}
    base-url: ${GOSMS_BASE_URL:https://app.gosms.eu}
  # Guarding *our* prepaid balance at the gateway, which is a different thing from the hunter's
  # credit above: this one is what keeps the product from going silent for everybody at once.
  # Only providers that can report a balance are guarded (GoSMS reads it from GET /api/v1/);
  # with the logging fake or Twilio there is nothing to read and the guard is inert.
  provider-credit:
    # What a message costs *us* (120 = 1.20 CZK on the GoSMS-test channel), against the 150 we
    # charge the hunter. Below this much credit an alert is retried rather than charged-and-lost.
    message-price-minor: ${SMS_PROVIDER_MESSAGE_PRICE_MINOR:120}
    # Warn in the logs at or below 20 CZK -- about 16 messages of notice.
    warn-minor: ${SMS_PROVIDER_CREDIT_WARN_MINOR:2000}
    # How long a healthy balance is trusted, so the guard costs one call every few minutes rather
    # than one per alert. A balance too low to send is never cached.
    ttl: ${SMS_PROVIDER_CREDIT_TTL:5m}
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    sender-id: ${TWILIO_SENDER_ID:}

management:
  endpoints:
    web:
      exposure:
        # Health only. The other endpoints (env, metrics, heapdump) would leak configuration
        # from a public Cloud Run URL, and nothing needs them yet.
        include: health
  endpoint:
    health:
      # Adds /actuator/health/liveness and /actuator/health/readiness — the probes Cloud Run
      # calls. Both only report application state; this service has no data store whose outage
      # should take an instance out of rotation.
      probes:
        enabled: true
