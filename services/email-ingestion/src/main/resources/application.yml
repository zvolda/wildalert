spring:
  application:
    name: email-ingestion

  # Optional local secrets (R2 creds) from the git-ignored .env at the repo root.
  config:
    import: optional:file:.env[.properties]

  # Outbound HTTP (the RestClient used to look up hunters). Without explicit timeouts a hung
  # user-account would hold the webhook open indefinitely. HunterLookupClient retries once, so
  # the worst case is roughly 2 x (connect + read).
  http:
    client:
      connect-timeout: 2s
      read-timeout: 5s

  # Trail-cam emails can carry large photos; raise the request size limit.
  servlet:
    multipart:
      max-request-size: 25MB
      max-file-size: 25MB

  # Kafka — used only when events.provider=kafka. Host apps reach the compose broker on 29092.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  # Cloud Run injects PORT; locally it falls back to the service's own port.
  port: ${PORT:8083}
  # Allow a larger raw email body (default is ~2MB).
  tomcat:
    max-http-form-post-size: 25MB
    max-swallow-size: 25MB

webhook:
  # Shared secret the email-routing webhook must send in the header below. Empty (the default)
  # leaves /api/emails open, which is fine locally — set WEBHOOK_SECRET before the service is
  # reachable from the internet, and put the same value in the Cloudflare Email Worker.
  secret: ${WEBHOOK_SECRET:}
  header-name: ${WEBHOOK_HEADER_NAME:X-Webhook-Secret}

services:
  # Base URL of the user-account service, used to match a sender to a hunter.
  user-account:
    base-url: ${USER_ACCOUNT_BASE_URL:http://localhost:8081}

events:
  # 'logging' (fake, default) or 'kafka'
  provider: ${EVENTS_PROVIDER:logging}
  topic:
    image-received: ${IMAGE_RECEIVED_TOPIC:image.received}

storage:
  # 'logging' (fake, default), 'filesystem' (local folder, readable by recognition) or 'r2'
  provider: ${STORAGE_PROVIDER:logging}
  filesystem:
    # Relative paths resolve against the working directory (the repo root for bootRun/tests).
    root: ${STORAGE_FILESYSTEM_ROOT:data/images}
  r2:
    endpoint: ${R2_ENDPOINT:}
    bucket: ${R2_BUCKET:}
    access-key: ${R2_ACCESS_KEY:}
    secret-key: ${R2_SECRET_KEY:}
    region: ${R2_REGION:auto}

management:
  endpoints:
    web:
      exposure:
        # Health only. The other endpoints (env, metrics, heapdump) would leak configuration
        # from a public Cloud Run URL, and nothing needs them yet.
        include: health
  endpoint:
    health:
      # Adds /actuator/health/liveness and /actuator/health/readiness — the probes Cloud Run
      # calls. Both only report application state; this service has no data store whose outage
      # should take an instance out of rotation.
      probes:
        enabled: true
