spring:
  application:
    name: user-account

  # Loads DB creds from the git-ignored .env (repo root) for local dev.
  # In the cloud these come from real environment variables instead.
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DATABASE_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate only validates that entities match it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

server:
  port: 8081

hunters:
  # Domain of hunters' personal inbound addresses (<token>@<domain>). In prod this is the
  # Cloudflare Email Routing catch-all subdomain, e.g. in.wildalert.app.
  inbound-domain: ${INBOUND_EMAIL_DOMAIN:in.wildalert.local}
