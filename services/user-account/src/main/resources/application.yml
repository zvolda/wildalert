spring:
  application:
    name: user-account

  # Loads DB creds from the git-ignored .env (repo root) for local dev.
  # In the cloud these come from real environment variables instead.
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DATABASE_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate only validates that entities match it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

server:
  # Cloud Run injects PORT; locally it falls back to the service's own port.
  port: ${PORT:8081}

billing:
  # What a new hunter starts with, in CZK minor units (haléře).
  #
  # **Zero by default, deliberately** (decided 2026-10-29, before the gateway's first deploy).
  # Registration is unauthenticated and unthrottled, so this value is the entire abuse budget of
  # a public form: at 2500 -- ten alerts with their recognition, at 100 + 150 each -- a scripted
  # signup is worth 25 CZK, and roughly sixteen abusive accounts could drain a 200 CZK GoSMS
  # balance. Draining it is the real damage, not the money: once GoSMS is empty, *paying* hunters
  # get no alerts, and for a product whose only output is an SMS that is a silent outage.
  #
  # The default is 0 rather than 2500-with-an-override because forgetting an env var should cost
  # nothing rather than give credit away. This project has been bitten by must-set config before
  # (INBOUND_EMAIL_DOMAIN, slice 13: unset, and nobody was ever texted).
  #
  # Turn it on with SIGNUP_GRANT_MINOR once there is rate limiting in front of the form --
  # Cloudflare Turnstile, or a Cloudflare rate-limit rule. A grant of 0 still writes a credit row
  # and a SIGNUP_GRANT ledger entry of 0, so every hunter has a balance and nothing downstream
  # needs a special case.
  #
  # Note V4's backfill granted 2500 to the hunters that existed when it ran. That is history, not
  # the default -- the migration is applied and must not be edited.
  signup-grant-minor: ${SIGNUP_GRANT_MINOR:0}

  # Below this balance, a charge reports LOW_BALANCE once, so the warning can be appended to an
  # alert that is going out anyway rather than costing an SMS of its own. 500 haléře is two
  # alerts with their recognition at 100 + 150.
  low-balance-threshold-minor: ${LOW_BALANCE_THRESHOLD_MINOR:500}

hunters:
  # Domain of hunters' personal inbound addresses (<token>@<domain>). In prod this is the
  # apex of the Cloudflare Email Routing zone, e.g. wildalert.app -- not a subdomain, because
  # Cloudflare allows a catch-all only on the apex (see deploy/email-worker/).
  inbound-domain: ${INBOUND_EMAIL_DOMAIN:wildalert.local}

management:
  endpoints:
    web:
      exposure:
        # Health only. The other endpoints (env, metrics, heapdump) would leak configuration
        # from a public Cloud Run URL, and nothing needs them yet.
        include: health
  endpoint:
    health:
      # Adds /actuator/health/liveness and /actuator/health/readiness — the probes Cloud Run calls.
      probes:
        enabled: true
      group:
        readiness:
          # By default readiness only means "startup finished". Every endpoint here needs the
          # database, so an instance that cannot reach Postgres/Cloud SQL should not be sent
          # traffic — verified by stopping the container and watching readiness go 503.
          include: readinessState,db
